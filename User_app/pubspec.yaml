name: pequire_user_app
description: A new Flutter project for Pequire User.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  cupertino_icons: ^1.0.2
  # State Management
  flutter_bloc: ^8.1.3
  # Networking
  dio: ^5.3.3
  # Functional Programming
  dartz: ^0.10.1
  # Service Locator
  get_it: ^7.6.4
  # Data Class Comparison
  equatable: ^2.0.5
  flutter_svg: ^2.2.3
  # Image Picker
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  lottie: ^3.3.1
  glassmorphism: ^3.0.0
  animations: ^2.1.1
  confetti: ^0.8.0
  # Location & Tracking
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  flutter_polyline_points: ^2.0.0
  socket_io_client: ^2.0.2
  geocoding: ^4.0.0
  js: ^0.6.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  descope: ^0.7.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  shimmer: ^3.0.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^20.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.webp"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/login_bg.webp
    - assets/onboarding_pricing.webp
    - assets/onboarding_professionals.webp
    - assets/onboarding_snap_solve.webp
    - assets/profile_avatar.webp
    - assets/Logo.svg
    - assets/Wordmark.svg
    - assets/login_header.svg
    - assets/login_header_utf8.svg
