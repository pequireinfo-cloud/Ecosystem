name: Build iOS IPAs

on:
  push:
    paths:
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build User App
        run: |
          cd User_app
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -9 -r ../User_Pequire.ipa Payload

      - name: Build Provider App
        run: |
          cd Provider_App
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -9 -r ../Provider_Pequire.ipa Payload

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ios-build-${{ github.run_id }} User_Pequire.ipa Provider_Pequire.ipa --title "iOS Build ${{ github.run_id }}" --notes "Automated iOS unsigned build generated by workflow"
