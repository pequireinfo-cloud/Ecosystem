<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pequire Service Provider Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pequire Provider">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo_icon.png"/>

  <title>Pequire Provider</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_MAPS_API_KEY"></script>

  <script>
    // Workaround to pierce Flutter Web's Shadow DOM and hide Google Maps API errors during dev
    setInterval(function() {
      function hideErrorElements(rootNode) {
        if (!rootNode || !rootNode.querySelectorAll) return;
        
        // Hide error classes
        var errNodes = rootNode.querySelectorAll('.gm-err-container, .gm-style-bg');
        for (var i = 0; i < errNodes.length; i++) {
          if (errNodes[i].style.display !== 'none') {
            errNodes[i].style.display = 'none';
          }
        }
        // Traverse all children to find nested shadow roots (Flutter's platform views)
        var allNodes = rootNode.querySelectorAll('*');
        for (var i = 0; i < allNodes.length; i++) {
          if (allNodes[i].shadowRoot) {
            hideErrorElements(allNodes[i].shadowRoot);
          }
        }
      }
      hideErrorElements(document);
    }, 1000);
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
